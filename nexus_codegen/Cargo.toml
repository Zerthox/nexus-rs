[package]
name = "nexus_codegen"
version = "0.3.3"
edition = "2024"
authors = ["Zerthox"]
description = "Helper macro to generate code for Raidcore Nexus addons"
repository = "https://github.com/zerthox/nexus-rs"
rust-version = "1.85.0"

[lib]
proc-macro = true

[dependencies]
cfg-if = "1.0.0"
env_filter = { version = "2.0.0", optional = true }
paste = "1.0.12"
proc-macro2 = "1.0.56"
quote = "1.0.26"
syn = { version = "3.0.10", features = ["full"] }

[features]
log_filter = ["dep:env_filter"]
